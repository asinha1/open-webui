[project]
name = "mh-grounding"
version = "0.1.0"
description = "Shared grounding core for the mh-tools (OWUI) and mh-mcp (agent) surfaces: SSRF-guarded fetch/render, Tavily search, over-search governor, CRAG RAG."
requires-python = ">=3.11"
dependencies = [
    "aiohttp",
    "beautifulsoup4",
    "markdownify",
    "certifi",
]

[project.optional-dependencies]
# The JS-render escalation (headless Chromium). Heavy; the lib degrades it off when absent.
render = ["playwright"]
# Prometheus exposition for out-of-OWUI processes (mh-mcp). OWUI keeps its own OTel decorator.
metrics = ["prometheus-client"]
# Agent-path RAG (P3): read-only chroma + the OWUI-matching embedder. PIN chromadb to
# the OWUI venv version (on-disk format) — 1.5.2 at build.
rag = ["chromadb==1.5.2", "sentence-transformers==5.4.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mh_grounding*"]
